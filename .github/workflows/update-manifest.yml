name: Update manifest

on:
  push:
    branches: [main]
    paths:
      - '_data/**/*.json'

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild manifest.json files
        run: |
          for dir in _data/*/; do
            folder="${dir%/}"
            manifest="$folder/manifest.json"
            files=$(find "$folder" -maxdepth 1 -name '*.json' ! -name 'manifest.json' -printf '%f\n' | sort)
            echo "$files" | jq -R -s -c 'split("\n") | map(select(length > 0))' > "$manifest"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/*/manifest.json
          git diff --cached --quiet || git commit -m "Auto-update manifest.json"
          git push
